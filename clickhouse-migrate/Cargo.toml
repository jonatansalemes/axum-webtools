[package]
name = "axum-webtools-clickhouse-migrate"
version = "0.1.61"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Jonatan Lemes"]
description = "General purpose migrate sql for ClickHouse, part of axum-webtools."
repository = "https://github.com/jonatansalemes/axum-webtools.git"
homepage = "https://github.com/jonatansalemes/axum-webtools.git"
documentation = "https://docs.rs/axum-webtools"
readme = "../README.md"
keywords = ["axum", "clickhouse", "migrate", "migration", "sql"]
categories = ["web-programming"]

[[bin]]
name = "clickhouse-migrate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = { version = "0.4" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9" }
sha2 = { version = "0.11" }
tokio = { version = "1.52", features = ["full"] }
urlencoding = { version = "2.1" }

[dev-dependencies]
rand = { version = "0.10" }
tempfile = { version = "3.27" }
